name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Generate platform folders
        run: flutter create . --platforms=android --project-name=mini_library_app --org=com.saabianas

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="مكتبة الشيخ أحمد الصعبي"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-library-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
